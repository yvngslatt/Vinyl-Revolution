<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/img/Logo.png" type="image/x-icon">
    <title>Vinyl Revolution</title>
</head>

<body>
    <header class="container">
        <img src="/img/Logo.png" alt="logo" width="100px" height="100px">
        <nav>
            <a href="">О нас</a>
            <a href="">Каталог</a>
            <a href="">Доставка и оплата</a>
            <a href="">Контакты</a>
        </nav>
        <div class="header__icons__menu">
            <img src="/img/fav.png" alt="">
            <img src="/img/account.png" alt="">
            <img src="/img/bag.png" alt="">
        </div>
    </header>
    <main>
        <section id="cover">
            <div class="backgroung__cover">
                <div class="cover__text container">
                    <p>Vinyl Revolution - больше, чем просто пластинки. Владей звуком - создавай революцию.</p>
                </div>
            </div>
        </section>
        <section id="main" class="container">
            <h2>ГЛАВНАЯ</h2>
            <div class="main__items">
                <div class="item">
                    <div class="item__inf">
                        <p>Новые релизы</p>
                        <img src="/img/new__releases.png" alt="Новые релизы">
                    </div>
                    <button type="button" class="item__button">Подробнее</button>
                </div>
                <div class="item">
                    <div class="item__inf">
                        <p>Классика</p>
                        <img src="/img/classic.png" alt="Классика">
                    </div>
                    <button type="button" class="item__button">Подробнее</button>
                </div>
                <div class="item">
                    <div class="item__inf">
                        <p>Западное</p>
                        <img src="/img/west.png" alt="Западное">
                    </div>
                    <button type="button" class="item__button">Подробнее</button>
                </div>
            </div>
        </section>
        <section id="popular__items" class="container">
            <h2>ПОПУЛЯРНЫЕ ТОВАРЫ</h2>
            <div class="popular__items">
                <div class="catalog__item">
                    <div class="artist">
                        <p>Скриптонит</p>
                        <img src="/img/fav.png" alt="">
                    </div>
                    <div class="name">2004</div>
                    <img src="/img/2004__album.png" alt="2004 album">
                    <div class="count">
                        <p>4 460₽</p>
                        <img src="/img/bag.png" alt="">
                    </div>
                </div>
                <div class="catalog__item">
                    <div class="artist">
                        <p>Metro Boomin</p>
                        <img src="/img/fav.png" alt="">
                    </div>
                    <div class="name">Heroes & Villains</div>
                    <img src="/img/heroes__album.png" alt="2004 album">
                    <div class="count">
                        <p>5 610₽</p>
                        <img src="/img/bag.png" alt="">
                    </div>
                </div>
                <div class="catalog__item">
                    <div class="artist">
                        <p>Queen</p>
                        <img src="/img/fav.png" alt="">
                    </div>
                    <div class="name">Queen</div>
                    <img src="/img/queen__album.png" alt="2004 album">
                    <div class="count">
                        <p>4 460₽</p>
                        <img src="/img/bag.png" alt="">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>


</html>
